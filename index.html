<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mandala interativa dos co-benefícios das zonas úmidas — Wetlands Co-Benefits Project: Integração · Natureza e Pessoas.">
<meta name="theme-color" content="#06141d">
<meta property="og:title" content="Mandala dos Co-benefícios">
<meta property="og:description" content="Uma jornada contemplativa pelo sol, a maré, o manguezal e os benefícios das zonas úmidas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2306141d'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23e0b060' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='11' fill='none' stroke='%235ba3b0' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23f2eada'/%3E%3C/svg%3E">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Mandala dos Co-benefícios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  /* One deliberate visual world: a night-tide cosmos. Single theme on purpose. */
  :root{
    --night:#06141d;      /* ground */
    --deep:#0c2433;       /* raised ground */
    --ink:#f2eada;        /* cream text, from the shell */
    --muted:#9db4bd;      /* tide-grey text */
    --line:rgba(242,234,218,.16);
    --gold:#e0b060;       /* the sun */
    --teal:#5ba3b0;
    --display:"Marcellus","Cormorant Garamond",Georgia,serif;
    --body:"Figtree","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
    background:
      radial-gradient(ellipse 70% 55% at 22% 18%, rgba(47,111,134,.30), transparent 70%),
      radial-gradient(ellipse 60% 50% at 85% 88%, rgba(63,111,60,.24), transparent 70%),
      var(--night);
    background-attachment:fixed;
  }
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding-inline:20px}

  /* top bar */
  .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:14px}
  .brand{display:flex;flex-direction:column;line-height:1.2}
  .brand-name{font-family:var(--display);font-size:1.12rem;letter-spacing:.01em}
  .brand-tag{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .tools{display:flex;align-items:center;gap:10px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{padding:6px 13px;font-size:.78rem;letter-spacing:.08em}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,.piece:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .ghost{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.8rem;letter-spacing:.04em;transition:background .3s,border-color .3s}
  .ghost:hover{border-color:rgba(242,234,218,.45)}
  .ghost[aria-pressed="true"]{background:rgba(224,176,96,.16);border-color:var(--gold);color:var(--gold)}

  /* stage */
  .stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding-bottom:28px}
  .mandala-col{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
  .mandala-wrap{width:min(100%,52dvh,560px);aspect-ratio:1;max-width:100%;border-radius:50%;overflow:hidden;clip-path:circle(50%)}
  #m{width:100%;height:100%;display:block;overflow:hidden;touch-action:manipulation}
  .caption{margin:0;min-height:1.7em;font-family:var(--display);font-size:1.05rem;text-align:center;color:var(--ink)}
  .caption small{font-family:var(--body);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-left:.6em}
  .views{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;max-width:560px}
  .legend-label{flex-basis:100%;text-align:center;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

  .chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;font-size:.82rem;line-height:1.3;text-align:left;transition:border-color .3s,background .3s}
  .chip:hover{border-color:rgba(242,234,218,.5);background:rgba(242,234,218,.05)}
  .chip[aria-pressed="true"]{border-color:var(--ink);background:rgba(242,234,218,.1)}
  .chip i{flex:none;width:11px;height:11px;border-radius:50%;background:var(--c)}

  /* panel: text on the night, no card */
  .panel{min-width:0;max-width:34rem;margin-inline:auto;width:100%;display:flex;flex-direction:column;gap:14px}
  .eyebrow{margin:0;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
  .eyebrow b{font-weight:600;color:var(--c,var(--gold))}
  .draft{font-size:.62rem;letter-spacing:.16em;border:1px dashed rgba(224,176,96,.7);color:var(--gold);border-radius:4px;padding:1px 6px}
  .head{display:flex;align-items:center;gap:16px}
  .thumb{flex:none;width:74px;height:74px;overflow:visible}
  .panel h1,.panel h2{margin:0;font-family:var(--display);font-weight:400;line-height:1.08;text-wrap:balance}
  .panel h1{font-size:clamp(2.2rem,5.2vw,3.5rem)}
  .panel h2{font-size:clamp(1.9rem,4.2vw,2.8rem)}
  .whisper{margin:0;font-family:var(--display);font-size:1.18rem;line-height:1.35;color:var(--c,var(--gold))}
  .body{margin:0;color:#dfe6e4;max-width:60ch}
  .note{margin:0;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;max-width:60ch}
  .links-label{margin:6px 0 0;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .links{display:flex;flex-wrap:wrap;gap:6px 8px}
  .nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}
  .nav .count{margin-left:auto;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .cta{background:var(--gold);color:#22170a;border-radius:999px;padding:11px 22px;font-weight:600;font-size:.95rem;transition:filter .3s}
  .cta:hover{filter:brightness(1.1)}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .panel-inner{display:flex;flex-direction:column;gap:14px;animation:rise .7s ease both}
  @keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* mandala pieces */
  #world{transform-origin:0 0;animation:breathe 10s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.014)}}
  .piece{cursor:pointer;stroke:var(--night);stroke-width:3.5;stroke-linejoin:round;transition:opacity .7s ease,filter .5s ease;animation:arrive 1s ease backwards;animation-delay:calc(var(--i)*45ms);outline:none}
  .piece.shell{stroke-width:2.2}
  @keyframes arrive{from{opacity:.12}}
  .piece:hover,.piece.hot{filter:brightness(1.2)}
  .has-sel .piece{opacity:.26}
  .has-sel .piece.shell{opacity:.5}
  .has-sel .piece.linked{opacity:.8}
  .has-sel .piece.sel{opacity:1;filter:brightness(1.12) drop-shadow(0 0 14px var(--c))}
  .deco{pointer-events:none;transition:opacity .7s ease}
  .has-sel .deco{opacity:.3}
  .ripple{fill:none;stroke:var(--ink);stroke-width:2;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:ripple 1.6s ease-out forwards}
  @keyframes ripple{from{transform:scale(.2);opacity:.9}to{transform:scale(7);opacity:0}}

  @media (max-width:939px){
    .stage{display:flex;flex-direction:column;align-items:center;gap:14px}
    .mandala-col{display:contents}
    .mandala-wrap{order:1}.caption{order:2}.panel{order:3;margin-bottom:10px}.views{order:4}.legend{order:5}
  }
  @media (min-width:940px){
    html,body{overflow:hidden}
    .app{height:100%;padding-inline:32px}
    .stage{grid-template-columns:minmax(0,1.2fr) minmax(340px,30rem);gap:40px;min-height:0;align-items:stretch}
    .mandala-col{justify-content:center;min-height:0}
    .mandala-wrap{width:min(100%,calc(100dvh - 235px))}
    .panel{overflow-y:auto;justify-content:safe center;margin:0;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  }
  @media (prefers-reduced-motion:reduce){
    #world,.piece,.panel-inner,.ripple{animation:none}
    .piece,.deco{transition:none}
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="brand-name">Wetlands Co-Benefits Project</span>
      <span class="brand-tag">Integration · Nature &amp; People</span>
    </div>
    <div class="tools">
      <button class="ghost" id="sound" type="button" aria-pressed="false"></button>
      <div class="seg" role="group" aria-label="Idioma / Language">
        <button type="button" id="lang-pt" aria-pressed="true">PT</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
        <button type="button" id="lang-es" aria-pressed="false">ES</button>
        <button type="button" id="lang-fr" aria-pressed="false">FR</button>
        <button type="button" id="lang-it" aria-pressed="false">IT</button>
        <button type="button" id="lang-ja" aria-pressed="false">JA</button>
      </div>
    </div>
  </header>
  <main class="stage">
    <section class="mandala-col">
      <div class="mandala-wrap">
        <svg id="m" viewBox="-520 -520 1040 1040" role="group">
          <defs><clipPath id="disc"><circle r="480"/></clipPath></defs>
          <g id="world">
            <g id="rim" class="deco"></g>
            <g id="outer" clip-path="url(#disc)"></g>
            <g id="shell"></g>
            <g id="fx"></g>
          </g>
        </svg>
      </div>
      <p class="caption" id="caption" aria-live="polite"></p>
      <div class="views" id="views"></div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
</div>

<script>
/* =====================================================================
   CONTEÚDO — edite aqui. Cada peça tem nome, "sussurro", texto e conexões.
   Os co-benefícios (cb1…cb13) percorrem os quatro domínios do projeto.
   ===================================================================== */
const DOMAINS = {
  nature:  {n:1, color:'#5e8f52', pt:{name:'Biodiversidade & Natureza', body:'A integridade do ecossistema: biodiversidade, polinização, produção primária, formação do solo, ciclagem de nutrientes e o caminho das águas. É a base viva de onde nascem todos os outros co-benefícios.'},
                                   en:{name:'Biodiversity & Nature', body:'The integrity of the ecosystem: biodiversity, pollination, primary production, soil formation, nutrient cycling and the pathways of water. The living ground from which every other co-benefit grows.'}},
  climate: {n:3, color:'#4f9bb0', pt:{name:'Clima', body:'O papel das zonas úmidas na mitigação e na adaptação climática: o carbono guardado, o carbono em movimento e a proteção da costa — com implicações para planos climáticos nacionais e metas internacionais.'},
                                   en:{name:'Climate', body:'The role of wetlands in climate mitigation and adaptation: carbon held, carbon in motion and a protected coast — with implications for national climate plans and international targets.'}},
  economy: {n:2, color:'#ddae5c', pt:{name:'Economia & Produção', body:'O valor econômico do que a zona úmida produz e sustenta: produtos, renda e empregos — e a valoração do carbono e dos demais serviços ecossistêmicos.'},
                                   en:{name:'Economy & Production', body:'The economic value of what a wetland produces and sustains: products, income and jobs — and the valuation of carbon and other ecosystem services.'}},
  social:  {n:4, color:'#c97f5e', pt:{name:'Social', body:'Como pescadores artesanais, marisqueiras, proprietários e gestores públicos percebem os co-benefícios e os incorporam em suas decisões — e como isso pode se tornar um indicador mensurável de justiça climática.'},
                                   en:{name:'Social', body:'How artisanal fishers, shellfish gatherers, landowners and public managers perceive co-benefits and bring them into their decisions — and how that can become a measurable indicator of climate justice.'}}
};

/* 12 elementos da natureza, em sentido horário a partir do sol (alto, à esquerda) */
const ELEMENTS = [
 {id:'sol', color:'#d9a552', bands:0, links:['cb3','mangue','cosmos'],
  pt:{name:'Sol', whisper:'Tudo o que vive é luz transformada.', body:'Toda a energia do manguezal começa aqui. A luz do sol move a fotossíntese, que transforma o gás carbônico do ar em folhas, troncos e raízes — o primeiro passo do carbono azul.'},
  en:{name:'Sun', whisper:'Everything alive is light, transformed.', body:'All the energy of the mangrove begins here. Sunlight drives photosynthesis, turning carbon dioxide from the air into leaves, trunks and roots — the first step of blue carbon.'}},
 {id:'cosmos', color:'#1d4560', bands:0, links:['lua','centro','sol'],
  pt:{name:'Céu & Estrelas', whisper:'Visto de longe, tudo é um só.', body:'Do espaço, as costas de manguezal aparecem como uma renda verde entre o rio e o mar. A mandala lembra que o manguezal não é um lugar isolado: é parte de um planeta vivo, de um único sistema.'},
  en:{name:'Sky & Stars', whisper:'From far enough away, everything is one.', body:'From space, mangrove coasts look like green lace between river and sea. The mandala is a reminder that a mangrove is never an isolated place: it belongs to one living planet, one system.'}},
 {id:'lua', color:'#44688a', bands:0, links:['mare','fauna','cb5'],
  pt:{name:'Lua', whisper:'O ritmo vem de cima.', body:'A lua puxa o oceano e dá o compasso do manguezal. Em costas de macromaré, o mar sobe e desce vários metros, duas vezes por dia, e toda a vida se organiza em torno desse pulso.'},
  en:{name:'Moon', whisper:'The rhythm comes from above.', body:'The moon pulls the ocean and sets the tempo of the mangrove. On macrotidal coasts, the sea rises and falls several metres twice a day, and all life arranges itself around that pulse.'}},
 {id:'chuva', color:'#7fb4c1', bands:1, links:['rio','cb5','cb4'],
  pt:{name:'Chuva', whisper:'A água sempre volta.', body:'A chuva alimenta os rios que descem até o estuário, trazendo água doce, sedimentos e nutrientes. É o encontro da água do céu, do rio e do mar que cria a zona úmida.'},
  en:{name:'Rain', whisper:'Water always returns.', body:'Rain feeds the rivers that run down to the estuary, carrying fresh water, sediment and nutrients. A wetland is born where water from the sky, the river and the sea meet.'}},
 {id:'mangue', color:'#3f6f3c', bands:0, vein:true, links:['raizes','cb1','cb6','cb8'],
  pt:{name:'Manguezal', whisper:'Uma floresta que aprendeu a viver na maré.', body:'Floresta entre a terra e o mar. Os manguezais crescem onde poucas árvores resistem: em solo salgado, encharcado e inundado pela maré duas vezes por dia.'},
  en:{name:'Mangrove forest', whisper:'A forest that learned to live with the tide.', body:'A forest between land and sea. Mangroves grow where few trees can: in salty, waterlogged ground, flooded by the tide twice a day.'}},
 {id:'raizes', color:'#6d8748', bands:0, vein:true, links:['cb8','lama','cb1'],
  pt:{name:'Raízes', whisper:'Onde há raiz, há abrigo.', body:'As raízes aéreas seguram a lama, quebram a força das ondas e formam um berçário protegido para peixes, camarões e caranguejos jovens.'},
  en:{name:'Roots', whisper:'Where there are roots, there is shelter.', body:'Aerial roots hold the mud in place, break the force of the waves and form a sheltered nursery for young fish, shrimp and crabs.'}},
 {id:'fauna', color:'#a8a254', bands:1, links:['cb1','cb2','cb9'],
  pt:{name:'Vida animal', whisper:'Cada espécie é um fio da teia.', body:'Caranguejo-uçá, guarás, garças, peixes, ostras — e aves migratórias que cruzam continentes para descansar e se alimentar aqui. Juntas, essas vidas mantêm o manguezal funcionando.'},
  en:{name:'Wildlife', whisper:'Every species is a thread in the web.', body:'Mangrove crabs, scarlet ibis, herons, fish, oysters — and migratory birds that cross continents to rest and feed here. Together these lives keep the mangrove working.'}},
 {id:'lama', color:'#74492e', bands:2, links:['cb6','cb4','raizes'],
  pt:{name:'Lama & Solo', whisper:'O tesouro está debaixo dos pés.', body:'No solo encharcado, com pouco oxigênio, a matéria orgânica se decompõe muito devagar — e o carbono fica guardado por séculos, até milênios. É aqui que mora a maior parte do carbono azul.'},
  en:{name:'Mud & Soil', whisper:'The treasure lies underfoot.', body:'In waterlogged, low-oxygen soil, organic matter decomposes very slowly — and carbon stays locked away for centuries, even millennia. This is where most blue carbon lives.'}},
 {id:'pessoas', color:'#b5714c', bands:1, links:['cb12','cb13','cb9','cb10'],
  pt:{name:'Pessoas & Comunidades', whisper:'Gente também é natureza.', body:'Pescadores artesanais, marisqueiras, catadores de caranguejo: comunidades que vivem do manguezal e cuidam dele há gerações. Onde o mangue é bem cuidado, natureza e gente formam um só território.'},
  en:{name:'People & Communities', whisper:'People are nature too.', body:'Artisanal fishers, shellfish gatherers, crab collectors: communities that have lived from the mangrove, and cared for it, for generations. Where the mangrove is well cared for, nature and people form a single territory.'}},
 {id:'rio', color:'#3f8c95', bands:2, links:['chuva','mar','cb5','cb7'],
  pt:{name:'Rio & Estuário', whisper:'Doce e salgado, sem fronteira.', body:'Os rios chegam ao mar devagar, misturando água doce e salgada. Essa mistura — o estuário — está entre os ambientes mais produtivos do planeta.'},
  en:{name:'River & Estuary', whisper:'Fresh and salt, with no border.', body:'Rivers reach the sea slowly, blending fresh and salt water. That blend — the estuary — is among the most productive environments on Earth.'}},
 {id:'mar', color:'#255a78', bands:2, links:['cb7','mare','rio'],
  pt:{name:'Mar', whisper:'Floresta e oceano são um sistema só.', body:'O oceano recebe do manguezal nutrientes e carbono, e devolve larvas, peixes e a própria maré. Ligados pela água, floresta e mar não existem um sem o outro.'},
  en:{name:'Ocean', whisper:'Forest and ocean are one system.', body:'The ocean receives nutrients and carbon from the mangrove, and gives back larvae, fish and the tide itself. Joined by water, forest and sea cannot exist without each other.'}},
 {id:'mare', color:'#5b9db3', bands:2, links:['lua','cb5','cb8'],
  pt:{name:'Marés & Ondas', whisper:'Inspire com a enchente. Expire com a vazante.', body:'Duas vezes por dia a maré inunda a floresta e depois se retira. Esse vai-e-vem distribui sedimentos, sementes e alimento — é a respiração do manguezal.'},
  en:{name:'Tides & Waves', whisper:'Breathe in with the flood. Breathe out with the ebb.', body:'Twice a day the tide floods the forest and then withdraws. This coming and going spreads sediment, seeds and food — it is the breathing of the mangrove.'}}
];

const CENTER = {id:'centro', color:'#f0e4c3', links:['cb1','cb6','cb9','cb12'],
  pt:{name:'Integração', whisper:'Cuidar de uma parte é beneficiar o todo.', body:'No centro da espiral, tudo se encontra. O náutilo cresce câmara por câmara sem abandonar a própria forma — como uma zona úmida saudável, em que natureza, clima, economia e pessoas crescem juntos. É isso um co-benefício.'},
  en:{name:'Integration', whisper:'To care for one part is to benefit the whole.', body:'At the centre of the spiral, everything meets. A nautilus grows chamber by chamber without ever leaving its own form — like a healthy wetland, where nature, climate, economy and people grow together. That is what a co-benefit is.'}};

/* Co-benefícios. Ordem = do centro da concha para fora. */
const COBENEFITS = [
 {id:'cb1', domain:'nature', links:['fauna','mangue','raizes'],
  pt:{name:'Biodiversidade', whisper:'Diversidade é resiliência.', body:'Zonas úmidas abrigam uma enorme variedade de plantas, peixes, crustáceos, aves e microrganismos. Ecossistemas íntegros e diversos resistem melhor às mudanças — e sustentam todos os outros co-benefícios.'},
  en:{name:'Biodiversity', whisper:'Diversity is resilience.', body:'Wetlands shelter an enormous variety of plants, fish, crustaceans, birds and microorganisms. Intact, diverse ecosystems withstand change better — and sustain every other co-benefit.'}},
 {id:'cb2', domain:'nature', links:['fauna','cb9'],
  pt:{name:'Polinização', whisper:'Um serviço silencioso.', body:'Abelhas e outros insetos, aves e morcegos visitam as flores do mangue e das matas vizinhas. Esse trabalho discreto garante a reprodução das plantas e, em muitas regiões, a produção de mel.'},
  en:{name:'Pollination', whisper:'A silent service.', body:'Bees and other insects, birds and bats visit the flowers of the mangrove and neighbouring forests. This quiet work secures plant reproduction and, in many regions, honey production.'}},
 {id:'cb3', domain:'nature', links:['sol','mangue','cb6'],
  pt:{name:'Produção primária', whisper:'Luz que vira floresta.', body:'Manguezais estão entre as florestas mais produtivas do planeta: transformam luz, água e nutrientes em folhas, madeira e raízes. Essa matéria viva é a base da teia alimentar do estuário.'},
  en:{name:'Primary production', whisper:'Light becoming forest.', body:'Mangroves are among the most productive forests on Earth: they turn light, water and nutrients into leaves, wood and roots. That living matter is the base of the estuary’s food web.'}},
 {id:'cb4', domain:'nature', links:['lama','chuva','raizes'],
  pt:{name:'Formação do solo & ciclagem de nutrientes', whisper:'A floresta constrói o próprio chão.', body:'Folhas caem, raízes crescem, sedimentos se depositam: o manguezal forma o seu próprio solo. Nesse processo, os nutrientes circulam entre lama, água e seres vivos, mantendo o sistema fértil.'},
  en:{name:'Soil formation & nutrient cycling', whisper:'The forest builds its own ground.', body:'Leaves fall, roots grow, sediment settles: the mangrove builds its own soil. Along the way, nutrients circulate between mud, water and living beings, keeping the system fertile.'}},
 {id:'cb5', domain:'nature', links:['mare','rio','chuva','lua'],
  pt:{name:'Regimes hidrológicos', whisper:'O caminho das águas.', body:'Zonas úmidas funcionam como esponjas: regulam o fluxo entre rio, maré e lençol freático, filtram a água e amortecem cheias e secas.'},
  en:{name:'Hydrological regimes', whisper:'The pathways of water.', body:'Wetlands work like sponges: they regulate the flow between river, tide and groundwater, filter water and soften both floods and droughts.'}},
 {id:'cb6', domain:'climate', links:['lama','cb3','cb7'],
  pt:{name:'Estoques de carbono', whisper:'Carbono guardado é clima protegido.', body:'Carbono azul é o carbono guardado pelos ecossistemas costeiros. Nos manguezais, a maior parte está no solo — inclusive em camadas profundas que a pesquisa ainda está revelando.'},

   cb6:{name:'Reservas de carbono', whisper:'Carbono guardado es clima protegido.', body:'El carbono azul es el carbono guardado por los ecosistemas costeros. En los manglares, la mayor parte está en el suelo, incluso en capas profundas que la investigación todavía está revelando.'},

 fr:{

   nature:{name:'Biodiversité et Nature', body:"L'intégrité de l'écosystème : biodiversité, pollinisation, production primaire, formation du sol, cycle des nutriments et cheminement de l'eau. C'est le socle vivant d'où naissent tous les autres cobénéfices."},

  el:{
   sol:{name:'Soleil', whisper:'Tout ce qui vit est de la lumière transformée.', body:"Toute l'énergie de la mangrove commence ici. La lumière du soleil anime la photosynthèse, qui transforme le dioxyde de carbone de l'air en feuilles, en troncs et en racines : le premier pas du carbone bleu."},
   cosmos:{name:'Ciel et Étoiles', whisper:'Vu d\u2019assez loin, tout ne fait qu\u2019un.', body:"Depuis l'espace, les côtes à mangrove ressemblent à une dentelle verte entre le fleuve et la mer. Le mandala rappelle qu'une mangrove n'est jamais un lieu isolé : elle appartient à une planète vivante, à un seul système."},
   lua:{name:'Lune', whisper:'Le rythme vient d\u2019en haut.', body:"La lune tire l'océan et donne la cadence de la mangrove. Sur les côtes à fort marnage, la mer monte et descend de plusieurs mètres, deux fois par jour, et toute la vie s'organise autour de ce pouls."},
   chuva:{name:'Pluie', whisper:'L\u2019eau revient toujours.', body:"La pluie alimente les fleuves qui descendent vers l'estuaire, apportant eau douce, sédiments et nutriments. Une zone humide naît là où se rencontrent l'eau du ciel, du fleuve et de la mer."},
   mangue:{name:'Mangrove', whisper:'Une forêt qui a appris à vivre avec la marée.', body:"Forêt entre la terre et la mer. Les mangroves poussent là où peu d'arbres résistent : dans un sol salé, gorgé d'eau et inondé par la marée deux fois par jour."},
   raizes:{name:'Racines', whisper:'Là où il y a des racines, il y a un abri.', body:"Les racines aériennes retiennent la vase, brisent la force des vagues et forment une nurserie protégée pour les jeunes poissons, crevettes et crabes."},
   fauna:{name:'Faune', whisper:'Chaque espèce est un fil de la toile.', body:"Crabes de mangrove, ibis rouges, hérons, poissons, huîtres, et oiseaux migrateurs qui traversent des continents pour se reposer et se nourrir ici. Ensemble, ces vies font fonctionner la mangrove."},
   lama:{name:'Vase et Sol', whisper:'Le trésor est sous nos pieds.', body:"Dans un sol gorgé d'eau et pauvre en oxygène, la matière organique se décompose très lentement, et le carbone reste enfermé pendant des siècles, voire des millénaires. C'est là que vit l'essentiel du carbone bleu."},
   pessoas:{name:'Personnes et Communautés', whisper:'Les humains aussi sont la nature.', body:"Pêcheurs artisanaux, ramasseuses de coquillages, ramasseurs de crabes : des communautés qui vivent de la mangrove et en prennent soin depuis des générations. Là où la mangrove est bien entretenue, nature et habitants forment un seul territoire."},
   rio:{name:'Fleuve et Estuaire', whisper:'Douce et salée, sans frontière.', body:"Les fleuves atteignent la mer lentement, mêlant eau douce et eau salée. Ce mélange, l'estuaire, compte parmi les milieux les plus productifs de la planète."},
   mar:{name:'Mer', whisper:'La forêt et l\u2019océan ne font qu\u2019un système.', body:"L'océan reçoit de la mangrove nutriments et carbone, et rend larves, poissons et la marée elle-même. Reliées par l'eau, forêt et mer n'existent pas l'une sans l'autre."},
   mare:{name:'Marées et Vagues', whisper:'Inspire avec le flux. Expire avec le reflux.', body:"Deux fois par jour, la marée inonde la forêt puis se retire. Ce va-et-vient répartit sédiments, graines et nourriture : c'est la respiration de la mangrove."}},
  center:{name:'Intégration', whisper:'Prendre soin d\u2019une partie, c\u2019est bénéficier au tout.', body:"Au centre de la spirale, tout se rejoint. Le nautile grandit loge après loge sans jamais quitter sa propre forme, comme une zone humide en bonne santé, où nature, climat, économie et personnes grandissent ensemble. C'est cela, un cobénéfice."},
  cb:{
   cb1:{name:'Biodiversité', whisper:'La diversité est une résilience.', body:"Les zones humides abritent une immense variété de plantes, de poissons, de crustacés, d'oiseaux et de micro-organismes. Des écosystèmes intacts et divers résistent mieux au changement, et soutiennent tous les autres cobénéfices."},
   cb2:{name:'Pollinisation', whisper:'Un service silencieux.', body:"Abeilles et autres insectes, oiseaux et chauves-souris visitent les fleurs de la mangrove et des forêts voisines. Ce travail discret assure la reproduction des plantes et, dans bien des régions, la production de miel."},
   cb3:{name:'Production primaire', whisper:'La lumière devenue forêt.', body:"Les mangroves comptent parmi les forêts les plus productives de la planète : elles transforment lumière, eau et nutriments en feuilles, en bois et en racines. Cette matière vivante est la base du réseau alimentaire de l'estuaire."},
   cb4:{name:'Formation du sol et cycle des nutriments', whisper:'La forêt construit son propre sol.', body:"Les feuilles tombent, les racines poussent, les sédiments se déposent : la mangrove fabrique son propre sol. Au passage, les nutriments circulent entre vase, eau et êtres vivants, et le système reste fertile."},
   cb5:{name:'Régimes hydrologiques', whisper:'Le chemin des eaux.', body:"Les zones humides fonctionnent comme des éponges : elles régulent les échanges entre fleuve, marée et nappe souterraine, filtrent l'eau et amortissent crues et sécheresses."},
   cb6:{name:'Stocks de carbone', whisper:'Carbone gardé, climat protégé.', body:"Le carbone bleu est le carbone retenu par les écosystèmes côtiers. Dans les mangroves, l'essentiel se trouve dans le sol, y compris dans des couches profondes que la recherche commence seulement à révéler."},
   cb7:{name:'Flux de carbone et export vers l\u2019océan', whisper:'Tout le carbone ne reste pas en place.', body:"Une partie du carbone voyage avec la marée, dissoute dans l'eau, et gagne l'océan. Mesurer cet export latéral est essentiel pour une comptabilité du carbone fidèle à la réalité."},
   cb8:{name:'Protection contre tempêtes et inondations', whisper:'Une digue vivante.', body:"Troncs et racines dissipent l'énergie des vagues et retiennent les sédiments, réduisant l'érosion et l'impact des tempêtes et des inondations sur les habitants du littoral."},
   cb9:{name:'Produits des zones humides', whisper:'La mangrove met à manger sur la table.', body:"Crabe, poisson, crevette, huître, moule : la mangrove nourrit des familles et approvisionne des marchés. Chiffrer cette valeur montre à quel point l'économie locale dépend d'un écosystème en bonne santé."},
   cb10:{name:'Génération de revenus', whisper:'Forêt debout, revenu à la maison.', body:"De la pêche artisanale au tourisme communautaire, le revenu de nombreuses familles naît d'une mangrove préservée. Valoriser le carbone et les autres services écosystémiques peut ouvrir de nouvelles sources, à condition qu'elles parviennent à celles et ceux qui en prennent soin."},
   cb11:{name:'Emplois et multiplicateur d\u2019emploi', whisper:'Un emploi en fait vivre d\u2019autres.', body:"Chaque activité liée à la zone humide en soutient d'autres autour d'elle : transport, commerce, transformation. Cet effet multiplicateur révèle le poids réel de la mangrove dans l'économie régionale."},
   cb12:{name:'Savoirs et modes de vie', whisper:'Écouter, c\u2019est aussi faire de la science.', body:"Pêcheurs, ramasseuses de coquillages, propriétaires et gestionnaires perçoivent et utilisent les cobénéfices de manières différentes. Écouter ces savoirs fait partie de la science, et conditionne une bonne gestion."},
   cb13:{name:'Justice climatique', whisper:'Celles et ceux qui prennent soin décident aussi.', body:"Celles et ceux qui protègent la mangrove doivent participer aux décisions et aux bénéfices. Les cobénéfices sociaux peuvent devenir des indicateurs mesurables de justice climatique, y compris dans la gouvernance des marchés du carbone bleu."}},
  ui:{soundOff:'♪ Activer le son', soundOn:'♪ Son activé', hint:'Touchez n\u2019importe quelle pièce du mandala',
   viewCosmos:'Mandala entier', viewShell:'Entrer dans la coquille', legend:'Domaines de cobénéfices',
   kindElement:'Élément de la nature', kindCenter:'Le centre', kindCb:'Cobénéfice', kindDomain:'Domaine', of:'de', draft:'',
   links:'Relié à', inDomain:'Cobénéfices de ce domaine', prev:'← Précédent', next:'Suivant →', auto:'▶ Parcours guidé', pause:'❙❙ Pause', back:'Revenir au début',
   introEyebrow:'La spirale qui relie la zone humide au tout, dans un mandala vivant', introTitle:'La spirale universelle',
   introBody:"Ce mandala réunit le soleil, la lune, la pluie, la mer, la marée, la mangrove et les personnes. En son cœur, la coquille du nautile garde les cobénéfices des zones humides, car c'est ainsi qu'ils existent : emboîtés les uns dans les autres, s'intégrant les uns aux autres. Rien ici n'existe seul : touchez une pièce et voyez à quoi elle se relie.",
   introNote:'', start:'Commencer le voyage', startSound:'Commencer avec le son',
   outroEyebrow:'Fin du voyage', outroTitle:'Le mandala complet',
   outroBody:"Soleil, marée, vase, forêt, personnes, carbone, revenu, justice : des pièces distinctes, un seul dessin. Protéger une zone humide, ce n'est jamais seulement stocker du carbone : c'est garder vivante toute cette toile.",
   aria:'Mandala interactif des cobénéfices des zones humides'}
 },
 it:{
  dom:{
   nature:{name:'Biodiversità e Natura', body:"L'integrità dell'ecosistema: biodiversità, impollinazione, produzione primaria, formazione del suolo, ciclo dei nutrienti e percorso delle acque. È il terreno vivo da cui nascono tutti gli altri cobenefici."},
   climate:{name:'Clima', body:"Il ruolo delle zone umide nella mitigazione e nell'adattamento climatico: il carbonio immagazzinato, il carbonio in movimento e la protezione della costa, con implicazioni per i piani climatici nazionali e gli obiettivi internazionali."},
   economy:{name:'Economia e Produzione', body:"Il valore economico di ciò che la zona umida produce e sostiene: prodotti, reddito e lavoro, e la valutazione del carbonio e degli altri servizi ecosistemici."},
   social:{name:'Sociale', body:"Come pescatori artigianali, raccoglitrici di molluschi, proprietari e amministratori pubblici percepiscono i cobenefici e li portano nelle proprie decisioni, e come questo possa diventare un indicatore misurabile di giustizia climatica."}},
  el:{
   sol:{name:'Sole', whisper:'Tutto ciò che vive è luce trasformata.', body:"Tutta l'energia della mangrovia comincia qui. La luce del sole muove la fotosintesi, che trasforma l'anidride carbonica dell'aria in foglie, tronchi e radici: il primo passo del carbonio blu."},
   cosmos:{name:'Cielo e Stelle', whisper:'Visto da lontano, tutto è uno.', body:"Dallo spazio, le coste a mangrovia sembrano un merletto verde tra il fiume e il mare. Il mandala ricorda che una mangrovia non è mai un luogo isolato: appartiene a un pianeta vivo, a un solo sistema."},
   lua:{name:'Luna', whisper:'Il ritmo viene dall\u2019alto.', body:"La luna tira l'oceano e detta il tempo della mangrovia. Nelle coste macrotidali il mare sale e scende di diversi metri, due volte al giorno, e tutta la vita si organizza attorno a questo battito."},
   chuva:{name:'Pioggia', whisper:'L\u2019acqua torna sempre.', body:"La pioggia alimenta i fiumi che scendono verso l'estuario, portando acqua dolce, sedimenti e nutrienti. Una zona umida nasce dove si incontrano l'acqua del cielo, del fiume e del mare."},
   mangue:{name:'Mangrovia', whisper:'Una foresta che ha imparato a vivere con la marea.', body:"Foresta tra la terra e il mare. Le mangrovie crescono dove pochi alberi resistono: in un suolo salato, intriso d'acqua e inondato dalla marea due volte al giorno."},
   raizes:{name:'Radici', whisper:'Dove c\u2019è radice, c\u2019è riparo.', body:"Le radici aeree trattengono il fango, spezzano la forza delle onde e formano una nursery protetta per pesci, gamberi e granchi giovani."},
   fauna:{name:'Fauna', whisper:'Ogni specie è un filo della rete.', body:"Granchi di mangrovia, ibis scarlatti, aironi, pesci, ostriche, e uccelli migratori che attraversano continenti per riposare e nutrirsi qui. Insieme, queste vite tengono in funzione la mangrovia."},
   lama:{name:'Fango e Suolo', whisper:'Il tesoro è sotto i piedi.', body:"In un suolo intriso d'acqua e povero di ossigeno, la materia organica si decompone molto lentamente, e il carbonio resta custodito per secoli, persino millenni. È qui che vive la maggior parte del carbonio blu."},
   pessoas:{name:'Persone e Comunità', whisper:'Anche le persone sono natura.', body:"Pescatori artigianali, raccoglitrici di molluschi, raccoglitori di granchi: comunità che vivono della mangrovia e se ne prendono cura da generazioni. Dove la mangrovia è ben curata, natura e persone formano un solo territorio."},
   rio:{name:'Fiume ed Estuario', whisper:'Dolce e salata, senza confine.', body:"I fiumi raggiungono il mare lentamente, mescolando acqua dolce e salata. Quella mescolanza, l'estuario, è tra gli ambienti più produttivi del pianeta."},
   mar:{name:'Mare', whisper:'Foresta e oceano sono un solo sistema.', body:"L'oceano riceve dalla mangrovia nutrienti e carbonio, e restituisce larve, pesci e la marea stessa. Uniti dall'acqua, foresta e mare non esistono l'uno senza l'altro."},
   mare:{name:'Maree e Onde', whisper:'Inspira con il flusso. Espira con il riflusso.', body:"Due volte al giorno la marea inonda la foresta e poi si ritira. Questo andirivieni distribuisce sedimenti, semi e cibo: è il respiro della mangrovia."}},
  center:{name:'Integrazione', whisper:'Prendersi cura di una parte giova al tutto.', body:"Al centro della spirale tutto si incontra. Il nautilo cresce camera dopo camera senza mai abbandonare la propria forma, come una zona umida sana, dove natura, clima, economia e persone crescono insieme. Questo è un cobeneficio."},
  cb:{
   cb1:{name:'Biodiversità', whisper:'La diversità è resilienza.', body:"Le zone umide ospitano un'enorme varietà di piante, pesci, crostacei, uccelli e microrganismi. Ecosistemi integri e diversi resistono meglio al cambiamento, e sostengono tutti gli altri cobenefici."},
   cb2:{name:'Impollinazione', whisper:'Un servizio silenzioso.', body:"Api e altri insetti, uccelli e pipistrelli visitano i fiori della mangrovia e dei boschi vicini. Questo lavoro discreto assicura la riproduzione delle piante e, in molte regioni, la produzione di miele."},
   cb3:{name:'Produzione primaria', whisper:'Luce che diventa foresta.', body:"Le mangrovie sono tra le foreste più produttive del pianeta: trasformano luce, acqua e nutrienti in foglie, legno e radici. Quella materia viva è la base della rete alimentare dell'estuario."},
   cb4:{name:'Formazione del suolo e ciclo dei nutrienti', whisper:'La foresta costruisce il proprio suolo.', body:"Cadono foglie, crescono radici, si depositano sedimenti: la mangrovia forma il proprio suolo. In questo processo i nutrienti circolano tra fango, acqua ed esseri viventi, mantenendo fertile il sistema."},
   cb5:{name:'Regimi idrologici', whisper:'Il cammino delle acque.', body:"Le zone umide funzionano come spugne: regolano il flusso tra fiume, marea e falda, filtrano l'acqua e attenuano piene e siccità."},
   cb6:{name:'Stock di carbonio', whisper:'Carbonio custodito è clima protetto.', body:"Il carbonio blu è il carbonio trattenuto dagli ecosistemi costieri. Nelle mangrovie la maggior parte si trova nel suolo, anche in strati profondi che la ricerca sta ancora rivelando."},
   cb7:{name:'Flussi di carbonio ed esportazione verso l\u2019oceano', whisper:'Non tutto il carbonio resta fermo.', body:"Parte del carbonio viaggia con la marea, disciolto nell'acqua, e prosegue verso l'oceano. Misurare questa esportazione laterale è essenziale per una contabilità del carbonio fedele alla realtà."},
   cb8:{name:'Protezione da tempeste e inondazioni', whisper:'Una barriera viva.', body:"Tronchi e radici dissipano l'energia delle onde e trattengono i sedimenti, riducendo l'erosione e l'impatto di tempeste e inondazioni su chi vive lungo la costa."},
   cb9:{name:'Prodotti delle zone umide', whisper:'La mangrovia porta cibo in tavola.', body:"Granchio, pesce, gambero, ostrica, cozza: la mangrovia nutre famiglie e rifornisce mercati. Quantificare questo valore mostra quanto l'economia locale dipenda da un ecosistema sano."},
   cb10:{name:'Generazione di reddito', whisper:'Foresta in piedi, reddito in casa.', body:"Dalla pesca artigianale al turismo di comunità, il reddito di molte famiglie nasce da una mangrovia conservata. Valorizzare il carbonio e gli altri servizi ecosistemici può aprire nuove fonti, purché arrivino a chi se ne prende cura."},
   cb11:{name:'Lavoro e moltiplicatore occupazionale', whisper:'Un lavoro ne sostiene altri.', body:"Ogni attività legata alla zona umida ne sostiene altre attorno a sé: nel trasporto, nel commercio, nella trasformazione. Questo effetto moltiplicatore rivela il peso reale della mangrovia nell'economia regionale."},
   cb12:{name:'Saperi e modi di vita', whisper:'Ascoltare è anche fare scienza.', body:"Pescatori, raccoglitrici di molluschi, proprietari e amministratori percepiscono e usano i cobenefici in modi diversi. Ascoltare questi saperi fa parte della scienza, ed è condizione per una buona gestione."},
   cb13:{name:'Giustizia climatica', whisper:'Chi se ne prende cura decide insieme.', body:"Chi protegge la mangrovia deve partecipare alle decisioni e ai benefici. I cobenefici sociali possono diventare indicatori misurabili di giustizia climatica, anche nella governance dei mercati del carbonio blu."}},
  ui:{soundOff:'♪ Attiva l\u2019audio', soundOn:'♪ Audio attivo', hint:'Tocca una qualsiasi parte del mandala',
   viewCosmos:'Mandala intero', viewShell:'Entra nella conchiglia', legend:'Ambiti dei cobenefici',
   kindElement:'Elemento della natura', kindCenter:'Il centro', kindCb:'Cobeneficio', kindDomain:'Ambito', of:'di', draft:'',
   links:'Collegato a', inDomain:'Cobenefici di questo ambito', prev:'← Precedente', next:'Successivo →', auto:'▶ Viaggio guidato', pause:'❙❙ Pausa', back:'Torna all\u2019inizio',
   introEyebrow:'La spirale che lega la zona umida al tutto, in un mandala vivo', introTitle:'La spirale universale',
   introBody:"Questo mandala riunisce il sole, la luna, la pioggia, il mare, la marea, la mangrovia e le persone. Nel suo cuore, la conchiglia del nautilo custodisce i cobenefici delle zone umide, perché è così che esistono: incastrati l'uno nell'altro, integrandosi l'uno con l'altro. Nulla qui esiste da solo: tocca una parte e guarda a cosa si collega.",
   introNote:'', start:'Inizia il viaggio', startSound:'Inizia con l\u2019audio',
   outroEyebrow:'Fine del viaggio', outroTitle:'Il mandala completo',
   outroBody:"Sole, marea, fango, foresta, persone, carbonio, reddito, giustizia: parti distinte, un solo disegno. Proteggere una zona umida non è mai solo immagazzinare carbonio: è tenere viva tutta questa trama.",
   aria:'Mandala interattivo dei cobenefici delle zone umide'}

 ja:{
  dom:{
   nature:{name:'生物多様性と自然', body:'生態系の健全さ。生物多様性、送粉、一次生産、土壌の形成、栄養塩の循環、そして水のめぐり。ほかのすべてのコベネフィットが生まれる、生きた土台です。'},
   climate:{name:'気候', body:'気候の緩和と適応における湿地の役割。蓄えられた炭素、動く炭素、そして守られる海岸。国の気候計画や国際目標にもつながります。'},
   economy:{name:'経済と生産', body:'湿地が生み、支えるものの経済的な価値。産物、所得、雇用、そして炭素やその他の生態系サービスの価値づけ。'},
   social:{name:'社会', body:'小規模漁業者、貝採りの女性たち、土地所有者、行政がコベネフィットをどう捉え、どう意思決定に取り入れるか。そしてそれが、気候正義の測れる指標になりうること。'}},
  el:{
   sol:{name:'太陽', whisper:'生きているものはすべて、かたちを変えた光。', body:'マングローブのエネルギーはすべてここから始まります。太陽の光が光合成を動かし、空気中の二酸化炭素を葉や幹や根に変える。ブルーカーボンの最初の一歩です。'},
   cosmos:{name:'空と星', whisper:'遠くから見れば、すべてはひとつ。', body:'宇宙から見ると、マングローブの海岸は川と海のあいだに広がる緑のレースのようです。この曼荼羅は、マングローブが孤立した場所ではなく、ひとつの生きた惑星、ひとつの系に属していることを思い出させます。'},
   lua:{name:'月', whisper:'リズムは空から来る。', body:'月が海を引き、マングローブの拍子をつくります。潮差の大きい海岸では、海は一日に二度、数メートルも上下し、すべての命がその脈動を軸に営まれています。'},
   chuva:{name:'雨', whisper:'水はいつも還ってくる。', body:'雨は川を養い、川は河口へと下りながら、淡水と土砂と栄養塩を運びます。空の水、川の水、海の水が出会うところに湿地が生まれます。'},
   mangue:{name:'マングローブ林', whisper:'潮とともに生きることを覚えた森。', body:'陸と海のあいだの森。マングローブは、塩を含み、水に浸かり、一日に二度潮に沈む土地という、ほとんどの木が育たない場所で育ちます。'},
   raizes:{name:'根', whisper:'根のあるところに、すみかがある。', body:'空中に張り出した根が泥を留め、波の力を和らげ、稚魚やエビ、カニの子どもたちのための守られた育ち場をつくります。'},
   fauna:{name:'動物たち', whisper:'どの種も、網の目の一本の糸。', body:'マングローブガニ、ショウジョウトキ、サギ、魚、カキ。そして大陸を越えてここで休み、餌をとる渡り鳥。これらの命が合わさって、マングローブは働きつづけます。'},
   lama:{name:'泥と土壌', whisper:'宝は足もとにある。', body:'水に浸かり酸素の乏しい土のなかでは、有機物の分解がとてもゆっくり進み、炭素は何世紀も、ときに何千年も閉じ込められたままになります。ブルーカーボンの大半はここにあります。'},
   pessoas:{name:'人と地域', whisper:'人もまた自然の一部。', body:'小規模漁業者、貝採りの女性たち、カニ採りの人たち。何世代にもわたってマングローブに生かされ、またそれを守ってきた人びとです。手入れの行き届いたマングローブでは、自然と人はひとつの土地をなしています。'},
   rio:{name:'川と河口', whisper:'淡水と海水に、境はない。', body:'川はゆっくりと海にたどり着き、淡水と海水を混ぜ合わせます。その混じり合い、すなわち河口域は、地球でもっとも生産力の高い環境のひとつです。'},
   mar:{name:'海', whisper:'森と海はひとつの系。', body:'海はマングローブから栄養塩と炭素を受け取り、幼生や魚、そして潮そのものを返します。水で結ばれた森と海は、どちらか一方だけでは存在できません。'},
   mare:{name:'潮と波', whisper:'満ち潮とともに吸い、引き潮とともに吐く。', body:'一日に二度、潮が森を満たし、そして引いていきます。この行き来が土砂と種子と餌を運び広げる。マングローブの呼吸です。'}},
  center:{name:'統合', whisper:'一部を大切にすることは、全体を豊かにすること。', body:'螺旋の中心で、すべてが出会います。オウムガイは自らのかたちを保ったまま、部屋をひとつずつ足して育ちます。健やかな湿地も同じで、自然と気候と経済と人がともに育ちます。それがコベネフィットです。'},
  cb:{
   cb1:{name:'生物多様性', whisper:'多様であることが、しなやかさ。', body:'湿地は、植物、魚、甲殻類、鳥、微生物のきわめて多様な生きものを育みます。健全で多様な生態系ほど変化に強く、ほかのすべてのコベネフィットを支えます。'},
   cb2:{name:'送粉', whisper:'静かな働き。', body:'ミツバチをはじめとする昆虫、鳥、コウモリが、マングローブや近くの森の花を訪れます。この目立たない働きが植物の繁殖を支え、多くの地域では蜂蜜の生産にもつながります。'},
   cb3:{name:'一次生産', whisper:'森になる光。', body:'マングローブは地球でもっとも生産力の高い森のひとつで、光と水と栄養塩を葉や材や根に変えます。その生きた物質が、河口域の食物網の土台になります。'},
   cb4:{name:'土壌の形成と栄養塩の循環', whisper:'森はみずから大地をつくる。', body:'葉が落ち、根が伸び、土砂が積もる。こうしてマングローブは自分の土壌をつくります。その過程で栄養塩が泥と水と生きもののあいだをめぐり、系を豊かに保ちます。'},
   cb5:{name:'水文環境', whisper:'水のゆくみち。', body:'湿地はスポンジのように働きます。川と潮と地下水のあいだの流れを調え、水を濾し、洪水と渇水の両方をやわらげます。'},
   cb6:{name:'炭素の蓄積', whisper:'蓄えられた炭素は、守られた気候。', body:'ブルーカーボンとは、沿岸の生態系が蓄える炭素のことです。マングローブではその大半が土壌にあり、研究がいま明らかにしつつある深い層にも及びます。'},
   cb7:{name:'炭素の流れと海への輸送', whisper:'炭素はとどまるだけではない。', body:'炭素の一部は水に溶けて潮とともに運ばれ、海へと向かいます。この横方向の輸送を測ることは、実態に忠実な炭素勘定に欠かせません。'},
   cb8:{name:'高潮と洪水からの防護', whisper:'生きている堤防。', body:'幹と根が波のエネルギーを和らげ、土砂をつなぎとめることで、侵食を抑え、海岸に暮らす人びとへの高潮や洪水の影響を小さくします。'},
   cb9:{name:'湿地の産物', whisper:'マングローブが食卓を満たす。', body:'カニ、魚、エビ、カキ、ムール貝。マングローブは家族を養い、市場を支えます。その価値を数で示すことで、地域経済が健全な生態系にどれほど支えられているかが見えてきます。'},
   cb10:{name:'所得の創出', whisper:'森が立っていれば、暮らしが立つ。', body:'小規模漁業から地域主体の観光まで、多くの家族の収入は守られたマングローブから生まれます。炭素やその他の生態系サービスを価値づけることは新しい収入源になりえます。ただし、それが守り手に届くことが条件です。'},
   cb11:{name:'雇用と雇用の波及', whisper:'ひとつの仕事が、ほかの仕事を支える。', body:'湿地に結びついた仕事は、運搬、流通、加工など、周囲の仕事を支えます。この波及効果が、地域経済におけるマングローブの実際の重みを映し出します。'},
   cb12:{name:'知恵と暮らしのかたち', whisper:'聴くこともまた、科学である。', body:'漁業者、貝採りの人たち、土地所有者、行政は、コベネフィットをそれぞれ異なるかたちで捉え、用いています。その知恵に耳を傾けることは科学の一部であり、良い管理の条件でもあります。'},
   cb13:{name:'気候正義', whisper:'守る人が、ともに決める。', body:'マングローブを守る人びとは、決定にも利益にも関わるべきです。社会的なコベネフィットは、ブルーカーボン市場のガバナンスも含め、気候正義の測れる指標になりえます。'}},
  ui:{soundOff:'♪ 音を出す', soundOn:'♪ 音が出ています', hint:'曼荼羅のどこかに触れてみてください',
   viewCosmos:'曼荼羅ぜんたい', viewShell:'殻のなかへ', legend:'コベネフィットの領域',
   kindElement:'自然の要素', kindCenter:'中心', kindCb:'コベネフィット', kindDomain:'領域', of:'／', draft:'',
   links:'つながっているもの', inDomain:'この領域のコベネフィット', prev:'← 前へ', next:'次へ →', auto:'▶ 自動でめぐる', pause:'❙❙ 一時停止', back:'はじめに戻る',
   introEyebrow:'湿地と全体をつなぐ螺旋、生きている曼荼羅として', introTitle:'普遍の螺旋',
   introBody:'この曼荼羅には、太陽、月、雨、海、潮、マングローブ、そして人が集まっています。その中心では、オウムガイの殻が湿地のコベネフィットを抱いています。コベネフィットとは、そのように存在するものだからです。互いに入れ子になり、互いに溶け合いながら。ここにあるものは何ひとつ単独では存在しません。どれかに触れて、何とつながっているか見てみてください。',
   introNote:'', start:'旅をはじめる', startSound:'音とともにはじめる',
   outroEyebrow:'旅のおわり', outroTitle:'曼荼羅のぜんたい',
   outroBody:'太陽、潮、泥、森、人、炭素、所得、正義。別々の要素が、ひとつの絵をなしています。湿地を守るとは、炭素を蓄えることだけではなく、この網の目ぜんたいを生かしつづけることです。',
   aria:'湿地のコベネフィットを示すインタラクティブな曼荼羅'}
 }
};
/* aplica as traduções às estruturas de dados */
(function(){
  for(const lg in T){
    const d=T[lg];
    for(const k in d.dom) DOMAINS[k][lg]=d.dom[k];
    ELEMENTS.forEach(e=>{ if(d.el[e.id]) e[lg]=d.el[e.id]; });
    CENTER[lg]=d.center;
    COBENEFITS.forEach(c=>{ if(d.cb[c.id]) c[lg]=d.cb[c.id]; });
    UI[lg]=d.ui;
  }
})();

</script>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- item registry ---------- */
const ITEMS={};
ELEMENTS.forEach(e=>{e.kind='element';ITEMS[e.id]=e;});
CENTER.kind='center';ITEMS[CENTER.id]=CENTER;
COBENEFITS.forEach((c,i)=>{c.kind='cb';c.index=i;ITEMS[c.id]=c;});
const ORDER=['sol','cosmos','lua','chuva','rio','mar','mare','mangue','raizes','fauna','lama','pessoas','centro',...COBENEFITS.map(c=>c.id)];

/* ---------- geometry: a nautilus growing into the world ---------- */
const R=480, C={x:-6,y:104};
const G=2.2, B=Math.log(G)/(2*Math.PI), N=13, D=40*Math.PI/180, RS=244, TE=-100*Math.PI/180, BOW=.42*D;
const P=(r,th)=>[C.x+r*Math.cos(th),C.y+r*Math.sin(th)];
const f=n=>(Math.round(n*10)/10);
const toPath=(pts,close=true)=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L')+(close?'Z':'');
const rs=th=>RS*Math.exp(B*(th-TE));
function septum(th){const a=[],ri=rs(th)/G,ro=rs(th);for(let i=0;i<=10;i++){const t=i/10;a.push(P(ri+(ro-ri)*t,th-BOW*Math.sin(Math.PI*t)));}return a;}
function chamber(k){const t1=TE-(N-k)*D,t2=t1+D,pts=[];
  for(let i=0;i<=16;i++){const th=t1+(t2-t1)*i/16;pts.push(P(rs(th),th));}
  pts.push(...septum(t2).reverse());
  for(let i=0;i<=16;i++){const th=t2-(t2-t1)*i/16;pts.push(P(rs(th)/G,th));}
  pts.push(...septum(t1));
  const tm=(t1+t2)/2;return {d:toPath(pts),anchor:P(rs(tm)*(1+1/G)/2,tm-BOW*.6)};}
function eye(){const t0=TE-N*D-2*Math.PI,t1=TE-N*D,pts=[];
  for(let i=0;i<=48;i++){const th=t0+(t1-t0)*i/48;pts.push(P(rs(th),th));}
  pts.push(...septum(t1).reverse());return toPath(pts);}
function eyeSpiral(){const pts=[];for(let th=TE-N*D-2*Math.PI;th>TE-N*D-7*Math.PI;th-=.12)pts.push(P(rs(th)*.97,th));return toPath(pts,false);}

const CS=.7,RHO=95,RMAX=680;
const sw=(phi,r)=>P(r,phi+Math.log(r/RHO)/CS);
function swirl(phi,r0=28,r1=RMAX){const a=[];for(let r=r0;r<=r1;r*=1.06)a.push(sw(phi,r));a.push(sw(phi,r1));return a;}
function sector(pA,pB){const pts=swirl(pA);const aA=pA+Math.log(RMAX/RHO)/CS,aB=pB+Math.log(RMAX/RHO)/CS;
  for(let i=1;i<8;i++)pts.push(P(RMAX,aA+(aB-aA)*i/8));
  pts.push(...swirl(pB).reverse());return toPath(pts);}
function anchorOn(phi,target=372){let best=null,bd=1e9;for(let r=110;r<RMAX;r+=6){const p=sw(phi,r),d=Math.hypot(p[0],p[1]);if(Math.abs(d-target)<bd){bd=Math.abs(d-target);best=p;}}return best;}
const SECT=2*Math.PI/ELEMENTS.length;
/* rotate the whole swirl so the sun lands top-left, like the logo */
let PHI0=0;{let bd=1e9;for(let deg=0;deg<360;deg++){const p0=deg*Math.PI/180,a=anchorOn(p0+SECT/2);let diff=Math.abs(Math.atan2(a[1],a[0])-(-2.30));diff=Math.min(diff,2*Math.PI-diff);if(diff<bd){bd=diff;PHI0=p0;}}}

function shade(hex,amt){const n=parseInt(hex.slice(1),16);const ch=s=>Math.max(0,Math.min(255,Math.round(((n>>s)&255)+amt*255)));return '#'+[16,8,0].map(s=>ch(s).toString(16).padStart(2,'0')).join('');}
const sparkle=(x,y,s)=>`M${f(x)} ${f(y-s)}Q${f(x)} ${f(y)} ${f(x+s)} ${f(y)}Q${f(x)} ${f(y)} ${f(x)} ${f(y+s)}Q${f(x)} ${f(y)} ${f(x-s)} ${f(y)}Q${f(x)} ${f(y)} ${f(x)} ${f(y-s)}Z`;
const drop=(x,y,s)=>`M${f(x)} ${f(y-s*1.2)}C${f(x+s)} ${f(y)} ${f(x+s*.9)} ${f(y+s)} ${f(x)} ${f(y+s)}C${f(x-s*.9)} ${f(y+s)} ${f(x-s)} ${f(y)} ${f(x)} ${f(y-s*1.2)}Z`;
function scatter(phi,count,dmin=255,dmax=440){const c=[];[.22,.5,.78].forEach((u,j)=>{for(let r=130+j*17;r<RMAX;r+=38){const p=sw(phi+SECT*u,r),d=Math.hypot(p[0],p[1]);if(d>dmin&&d<dmax)c.push(p);}});
  const out=[];const step=Math.max(1,c.length/count);for(let i=0;i<c.length&&out.length<count;i+=step)out.push(c[Math.floor(i)]);return out;}

/* ---------- build the mandala ---------- */
const svg=$('#m'),gOuter=$('#outer'),gShell=$('#shell'),gRim=$('#rim'),gFx=$('#fx');
const anchors={};let pieceCount=0;
function makePiece(parent,tag,attrs,item,cls=''){
  const p=el(tag,Object.assign({class:'piece '+cls,'data-id':item.id,tabindex:'0',role:'button',fill:item.color,style:`--c:${item.color};--i:${pieceCount++}`},attrs),parent);
  p.addEventListener('click',()=>select(item.id,true));
  p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(item.id,true);}});
  p.addEventListener('pointerenter',()=>{state.hover=item.id;caption();});
  p.addEventListener('pointerleave',()=>{state.hover=null;caption();});
  p.addEventListener('focus',()=>{state.hover=item.id;caption();});
  p.addEventListener('blur',()=>{state.hover=null;caption();});
  return p;}

function build(){
  // rim: seeds and cardinal marks
  el('circle',{r:497,fill:'none',stroke:'#f2eada','stroke-opacity':.28,'stroke-width':1.2},gRim);
  for(let i=0;i<13;i++){const a=-Math.PI/2+i*2*Math.PI/13;el('circle',{cx:f(497*Math.cos(a)),cy:f(497*Math.sin(a)),r:4.2,fill:'#f2eada','fill-opacity':.75},gRim);}
  el('circle',{r:482,fill:'#06141d'},gRim);

  ELEMENTS.forEach((e,j)=>{
    const pA=PHI0+j*SECT,pB=pA+SECT;
    makePiece(gOuter,'path',{d:sector(pA,pB)},e);
    anchors[e.id]=anchorOn(pA+SECT/2);
    // tonal half-band, like the layered waves of the logo
    el('path',{class:'deco',d:sector(pA,pA+SECT*.5),fill:'#ffffff','fill-opacity':.075},gOuter);
    for(let b=1;b<=e.bands;b++)el('path',{class:'deco',d:toPath(swirl(pA+SECT*b/(e.bands+1),90),false),fill:'none',stroke:'#06141d','stroke-opacity':.5,'stroke-width':2},gOuter);
    if(e.vein)el('path',{class:'deco',d:toPath(swirl(pA+SECT*.5,150),false),fill:'none',stroke:'#f2eada','stroke-opacity':.35,'stroke-width':1.6},gOuter);
  });
  // sun, stars, moon, rain
  const s=anchors.sol;makePiece(gOuter,'circle',{cx:f(s[0]),cy:f(s[1]),r:54},Object.assign({},ITEMS.sol,{color:'#e6bb6a'}));
  scatter(PHI0+SECT,7).forEach((p,i)=>el('path',{class:'deco',d:sparkle(p[0],p[1],[15,7,11,6,18,8,10][i%7]),fill:'#f2eada'},gOuter));
  const m=anchors.lua;el('path',{class:'deco',d:`M${f(m[0])} ${f(m[1]-32)}A32 32 0 1 1 ${f(m[0])} ${f(m[1]+32)}A41 41 0 0 0 ${f(m[0])} ${f(m[1]-32)}Z`,fill:'#f2eada','fill-opacity':.92},gOuter);
  scatter(PHI0+3*SECT,6).forEach((p,i)=>el('path',{class:'deco',d:drop(p[0],p[1],[9,6,8,5,7,6][i%6]),fill:'#f2eada','fill-opacity':.7},gOuter));

  // the shell: chambers, inner → outer, coloured by domain
  COBENEFITS.forEach((c,k)=>{const dom=DOMAINS[c.domain];c.color=shade(dom.color,(k%2?.05:-.025));
    const ch=chamber(k);anchors[c.id]=ch.anchor;makePiece(gShell,'path',{d:ch.d},c,'shell');});
  makePiece(gShell,'path',{d:eye()},CENTER,'shell');anchors.centro=[C.x,C.y];
  el('path',{class:'deco',d:eyeSpiral(),fill:'none',stroke:'#8a7a52','stroke-width':1.6,'stroke-linecap':'round'},gShell);
}

/* ---------- state & rendering ---------- */
const state={lang:'pt',sel:null,mode:'intro',domain:null,hover:null,auto:false};
const LANGS=['pt','en','es','fr','it','ja'];
try{const l=localStorage.getItem('mandala-lang');if(LANGS.includes(l))state.lang=l;}catch(e){}
const L=()=>state.lang, t=k=>UI[L()][k];
const nameOf=id=>ITEMS[id][L()].name;

function caption(){const c=$('#caption');const id=state.hover||state.sel;
  if(id){const it=ITEMS[id];const kind=it.kind==='cb'?DOMAINS[it.domain][L()].name:it.kind==='center'?t('kindCenter'):t('kindElement');c.innerHTML=esc(nameOf(id))+'<small>'+esc(kind)+'</small>';}
  else if(state.mode==='domain'){c.textContent=DOMAINS[state.domain][L()].name;}
  else c.innerHTML='<small style="margin:0">'+esc(t('hint'))+'</small>';}

function paintSelection(){
  svg.classList.toggle('has-sel',!!state.sel||state.mode==='domain');
  svg.querySelectorAll('.piece').forEach(p=>{const id=p.dataset.id,it=ITEMS[id];let sel=false,linked=false;
    if(state.mode==='domain'){sel=it.kind==='cb'&&it.domain===state.domain;}
    else if(state.sel){sel=id===state.sel;linked=ITEMS[state.sel].links.includes(id);}
    p.classList.toggle('sel',sel);p.classList.toggle('linked',linked);
    p.setAttribute('aria-label',it[L()].name);p.setAttribute('aria-pressed',sel?'true':'false');});}

function chipHTML(id){const it=ITEMS[id];return `<button type="button" class="chip" data-go="${id}" style="--c:${it.color}"><i></i>${esc(nameOf(id))}</button>`;}
function navHTML(){const i=ORDER.indexOf(state.sel);
  return `<div class="nav"><button type="button" class="ghost" data-act="prev">${t('prev')}</button><button type="button" class="ghost" data-act="auto" aria-pressed="${state.auto}">${state.auto?t('pause'):t('auto')}</button><button type="button" class="ghost" data-act="next">${t('next')}</button>${i>=0?`<span class="count">${i+1} / ${ORDER.length}</span>`:''}</div>`;}
function thumbHTML(id){const nodes=[...svg.querySelectorAll(`.piece[data-id="${id}"]`)];if(!nodes.length)return '';
  const path=nodes[0];let bb;try{bb=path.getBBox();}catch(e){return '';}
  // clip the outer pieces to the disc so the thumbnail matches what is seen
  const x0=Math.max(bb.x,-R),y0=Math.max(bb.y,-R),x1=Math.min(bb.x+bb.width,R),y1=Math.min(bb.y+bb.height,R),pad=10;
  const clip=ITEMS[id].kind==='element'?' clip-path="url(#disc)"':'';
  return `<svg class="thumb" viewBox="${f(x0-pad)} ${f(y0-pad)} ${f(x1-x0+2*pad)} ${f(y1-y0+2*pad)}" aria-hidden="true"><g${clip}><path d="${path.getAttribute('d')}" fill="${ITEMS[id].color}"/></g></svg>`;}

function renderPanel(){const p=$('#panel');let h='';
  if(state.mode==='intro'){
    h=`<p class="eyebrow">${t('introEyebrow')}</p><h1>${t('introTitle')}</h1><p class="body">${t('introBody')}</p>
       <div class="row"><button type="button" class="cta" data-act="start">${t('start')}</button><button type="button" class="ghost" data-act="start-sound">${t('startSound')}</button></div>
       ${t('introNote')?`<p class="note">${t('introNote')}</p>`:''}`;
  }else if(state.mode==='outro'){
    h=`<p class="eyebrow">${t('outroEyebrow')}</p><h1>${t('outroTitle')}</h1><p class="body">${t('outroBody')}</p>
       <div class="row"><button type="button" class="ghost" data-act="home">${t('back')}</button></div>`;
  }else if(state.mode==='domain'){const d=DOMAINS[state.domain];
    h=`<p class="eyebrow" style="--c:${d.color}"><b>${t('kindDomain')} ${d.n} ${t('of')} 4</b></p><h2>${esc(d[L()].name)}</h2><p class="body">${esc(d[L()].body)}</p>
       <p class="links-label">${t('inDomain')}</p><div class="links">${COBENEFITS.filter(c=>c.domain===state.domain).map(c=>chipHTML(c.id)).join('')}</div>
       <div class="row"><button type="button" class="ghost" data-act="home">${t('back')}</button></div>`;
  }else{const it=ITEMS[state.sel],x=it[L()];let eyebrow;
    if(it.kind==='cb'){const d=DOMAINS[it.domain];eyebrow=`<b>${t('kindCb')}</b><span>${esc(d[L()].name)}</span>`;}
    else eyebrow=`<b>${it.kind==='center'?t('kindCenter'):t('kindElement')}</b>`;
    h=`<p class="eyebrow" style="--c:${it.color}">${eyebrow}</p>
       <div class="head">${thumbHTML(it.id)}<h2>${esc(x.name)}</h2></div>
       <p class="whisper" style="--c:${it.kind==='element'&&['cosmos','mar','lama','lua'].includes(it.id)?'#e0b060':it.color}">${esc(x.whisper)}</p>
       <p class="body">${esc(x.body)}</p>
       <p class="links-label">${t('links')}</p><div class="links">${it.links.map(chipHTML).join('')}</div>${navHTML()}`;}
  p.innerHTML='<div class="panel-inner">'+h+'</div>';}

function renderChrome(){
  document.documentElement.lang={pt:'pt-BR',en:'en',es:'es',fr:'fr',it:'it',ja:'ja'}[L()];
  svg.setAttribute('aria-label',t('aria'));
  LANGS.forEach(l=>{const b=$('#lang-'+l);if(b)b.setAttribute('aria-pressed',L()===l);});
  $('#sound').textContent=audio.on?t('soundOn'):t('soundOff');$('#sound').setAttribute('aria-pressed',audio.on);
  $('#views').innerHTML=`<button type="button" class="ghost" data-view="cosmos" aria-pressed="${view==='cosmos'}">${t('viewCosmos')}</button><button type="button" class="ghost" data-view="shell" aria-pressed="${view==='shell'}">${t('viewShell')}</button>`;
  $('#legend').innerHTML=`<span class="legend-label">${t('legend')}</span>`+['nature','economy','climate','social'].map(k=>`<button type="button" class="chip" data-domain="${k}" aria-pressed="${state.mode==='domain'&&state.domain===k}" style="--c:${DOMAINS[k].color}"><i></i>${esc(DOMAINS[k][L()].name)}</button>`).join('');
}
function renderAll(){renderChrome();renderPanel();paintSelection();caption();}

/* ---------- camera ---------- */
const VB={cosmos:[-520,-520,1040,1040],shell:[C.x-292,C.y-292,584,584]};
let view='cosmos',vb=VB.cosmos.slice(),camRaf=0,warp=0;
function setView(v){if(v===view)return;view=v;const from=vb.slice(),to=VB[v],t0=performance.now(),dur=reduced?1:1500;
  cancelAnimationFrame(camRaf);
  (function step(now){let k=Math.min(1,(now-t0)/dur);const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    vb=from.map((a,i)=>a+(to[i]-a)*e);svg.setAttribute('viewBox',vb.map(f).join(' '));
    warp=reduced?0:Math.sin(Math.PI*k)*(v==='shell'?1:-1);
    if(k<1)camRaf=requestAnimationFrame(step);else warp=0;})(t0);
  renderChrome();}

/* ---------- actions ---------- */
function ripple(id){if(reduced)return;const a=anchors[id];if(!a)return;const c=el('circle',{class:'ripple',cx:f(a[0]),cy:f(a[1]),r:24},gFx);setTimeout(()=>c.remove(),1700);}
function select(id,user){
  if(user)stopAuto();
  if(state.mode==='item'&&state.sel===id&&user){home();return;}
  state.sel=id;state.mode='item';state.domain=null;
  const it=ITEMS[id];setView(it.kind==='element'?'cosmos':'shell');
  ripple(id);audio.chime(ORDER.indexOf(id));renderAll();}
function home(){stopAuto();state.sel=null;state.mode='intro';state.domain=null;setView('cosmos');renderAll();}
function outro(){stopAuto();state.sel=null;state.mode='outro';state.domain=null;setView('cosmos');audio.chime(27);renderAll();}
function showDomain(k){stopAuto();if(state.mode==='domain'&&state.domain===k){home();return;}state.sel=null;state.mode='domain';state.domain=k;setView('shell');audio.chime(['nature','economy','climate','social'].indexOf(k)*3);renderAll();}
function go(dir){const i=ORDER.indexOf(state.sel);const n=i+dir;if(n>=ORDER.length){outro();return;}if(n<0){home();return;}select(ORDER[n],false);}
let autoTimer=0;
function startAuto(){state.auto=true;clearInterval(autoTimer);autoTimer=setInterval(()=>{if(state.mode!=='item'){stopAuto();renderPanel();return;}go(1);},11000);}
function stopAuto(){state.auto=false;clearInterval(autoTimer);}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){select(b.dataset.go,true);return;}
  if(b.dataset.domain){showDomain(b.dataset.domain);return;}
  if(b.dataset.view){setView(b.dataset.view);return;}
  switch(b.dataset.act){
    case 'start':select(ORDER[0],true);break;
    case 'start-sound':audio.toggle(true);select(ORDER[0],true);break;
    case 'home':home();break;
    case 'prev':stopAuto();go(-1);break;
    case 'next':stopAuto();go(1);break;
    case 'auto':if(state.auto){stopAuto();}else{startAuto();}renderPanel();break;}
  if(b.id==='sound'){audio.toggle();renderChrome();}
  if(b.id&&b.id.startsWith('lang-')&&LANGS.includes(b.id.slice(5))){state.lang=b.id.slice(5);try{localStorage.setItem('mandala-lang',state.lang);}catch(err){}renderAll();}
});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;
  if(e.key==='Escape')home();
  if(state.mode==='item'&&e.key==='ArrowRight'){stopAuto();go(1);}
  if(state.mode==='item'&&e.key==='ArrowLeft'){stopAuto();go(-1);}});

/* ---------- sound: a drone, a slow sea, and one bell per piece ---------- */
const audio={on:false,ctx:null,master:null,bus:null,
  build(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;const c=this.ctx=new AC();
    this.master=c.createGain();this.master.gain.value=0;this.master.connect(c.destination);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;lp.connect(this.master);
    [[110,.06,.05],[164.81,.04,.07],[220,.035,.09],[277.18,.02,.06],[329.63,.014,.11]].forEach(([fr,g,lf])=>{
      const o=c.createOscillator();o.frequency.value=fr;o.detune.value=(Math.random()-.5)*8;const gn=c.createGain();gn.gain.value=g;
      const l=c.createOscillator();l.frequency.value=lf;const lg=c.createGain();lg.gain.value=g*.6;l.connect(lg);lg.connect(gn.gain);
      o.connect(gn);gn.connect(lp);o.start();l.start();});
    const len=c.sampleRate*3,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){last=(last+.03*(Math.random()*2-1))/1.03;d[i]=last*3;}
    const n=c.createBufferSource();n.buffer=buf;n.loop=true;const nf=c.createBiquadFilter();nf.type='lowpass';nf.frequency.value=700;
    const ng=c.createGain();ng.gain.value=.12;const sl=c.createOscillator();sl.frequency.value=.085;const sg=c.createGain();sg.gain.value=.1;sl.connect(sg);sg.connect(ng.gain);
    n.connect(nf);nf.connect(ng);ng.connect(this.master);n.start();sl.start();
    const dl=c.createDelay(1);dl.delayTime.value=.41;const fb=c.createGain();fb.gain.value=.38;this.bus=c.createGain();
    this.bus.connect(this.master);this.bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(this.master);return true;},
  toggle(force){const want=force===true?true:!this.on;if(want&&!this.ctx&&!this.build())return;
    this.on=want;if(!this.ctx)return;if(want)this.ctx.resume();
    const g=this.master.gain,now=this.ctx.currentTime;g.cancelScheduledValues(now);g.setValueAtTime(g.value,now);g.linearRampToValueAtTime(want?.7:0,now+(want?2.5:.8));},
  chime(i){if(!this.on||!this.ctx)return;if(i<0)i=0;const c=this.ctx,now=c.currentTime,sc=[0,2,4,7,9];
    const semi=sc[i%5]+12*(Math.floor(i/5)%3),fr=220*Math.pow(2,semi/12);
    [[1,.16],[2,.05],[3.01,.02]].forEach(([m,a])=>{const o=c.createOscillator();o.type='sine';o.frequency.value=fr*m;const g=c.createGain();
      g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(a,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+3.2);
      o.connect(g);g.connect(this.bus);o.start(now);o.stop(now+3.3);});}
};

/* ---------- the sky ---------- */
function sky(){const cv=$('#sky'),cx=cv.getContext('2d');let W,H,stars=[];
  function size(){const dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);}
  size();addEventListener('resize',()=>{size();if(reduced)draw(0);});
  for(let i=0;i<230;i++)stars.push({a:Math.random()*6.283,d:Math.pow(Math.random(),.6),s:Math.random()*1.3+.3,tw:Math.random()*6.283,sp:.5+Math.random()});
  function draw(tm){cx.clearRect(0,0,W,H);const mx=Math.hypot(W,H)/2;
    for(const s of stars){const pd=s.d;if(!reduced){s.d+=(.000035+Math.abs(warp)*.011)*(.25+s.d)*s.sp*(warp<0?-1:1);s.a+=.00004;
        if(s.d>1.05)s.d=.03;if(s.d<.02)s.d=1.04;}
      const x=W/2+Math.cos(s.a)*s.d*mx,y=H/2+Math.sin(s.a)*s.d*mx,al=.3+.5*(.5+.5*Math.sin(tm*.0011*s.sp+s.tw));
      if(Math.abs(warp)>.05&&Math.abs(s.d-pd)<.2){cx.strokeStyle=`rgba(242,234,218,${al*.8})`;cx.lineWidth=s.s;cx.beginPath();cx.moveTo(W/2+Math.cos(s.a)*pd*mx,H/2+Math.sin(s.a)*pd*mx);cx.lineTo(x,y);cx.stroke();}
      else{cx.fillStyle=`rgba(242,234,218,${al})`;cx.beginPath();cx.arc(x,y,s.s,0,6.283);cx.fill();}}
    if(!reduced)requestAnimationFrame(draw);}
  draw(0);}

/* ---------- boot ---------- */
function start(data){
  if(data&&data.lang)state.lang=data.lang;
  build();sky();renderAll();
  if(data&&data.sel&&ITEMS[data.sel])select(data.sel,false);
  window.claude?.hot?.snapshot?.(()=>({lang:state.lang,sel:state.sel}));
}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
})();
</script>
